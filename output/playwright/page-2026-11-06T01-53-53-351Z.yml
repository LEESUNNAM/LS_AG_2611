        - generic [ref=f16e98]:
          - article [ref=f16e100]:
            - strong [ref=f16e101]: ‘데이터센터 모라토리엄’ 내건 미 민주당, 중간선거 압승 AI 투자·메모리 수요 감소 우려에 5일 삼전닉스 주가 급락 업계, AI 인프라 확장 ‘속도조절’해도 지속 전망
            - text: 미국 중간선거가 민주당이 공화당 강세 지역까지 휩쓰는 ‘블루 쓰나미’로 귀결되면서 인공지능(AI) 데이터센터 규제 강화 흐름이 실제로 나타날 경우 한국 반도체 업계에 변수로 작용할 지 주목되고 있다. 업계에선 반도체 호황의 흐름이 꺾일 가능성보다는 속도조절 쪽에 무게를 두면서도, 미국 내 AI 인프라 구축 둔화가 서버용 메모리 수요에도 영향을 미칠 가능성을 예의주시하고 있다.5일 유가증권시장에서 삼성전자는 전장보다 7.57% 내린 20만1500원에, SK하이닉스는 9.46% 급락한 126만4000원에 정규장 거래를 마무리했다. AI 데이터센터 규제로 인한 반도체 수요 감소 우려가 악재로 작용했다.지난 3일(현지시간) 치러진 미 중간선거에서 민주당이 연방 상·하원은 물론 주지사 선거에서까지 약진한 데는 물가 상승, 이란 전쟁 등 도널드 트럼프 공화당 행정부 정책에 대한 불만과 더불어 AI 데이터센터 건설 반대 여론이 주요하게 작용한 것으로 풀이된다. 특히 텍사스, 조지아, 오하이오 등 지역에서 당선된 민주당 소속 주지사들은 데이터센터 모라토리엄(일시 중단)이나 규제 강화를 공약했다. 이에 주정부 차원에서 지역 내 신규 데이터센터 건설 승인 요건이나 각종 인허가 절차, 전력·용수 공급 과정을 보다 까다롭게 만들 수 있다는 관측도 나온다.
            - generic [ref=f16e102]:
              - img "미국 캔자스주 리븐워스 카운티의 한 잔디밭에 3일(현지시간) ‘데이터센터 반대’라고 적힌 푯말이 세워져 있다. 로이터연합뉴스" [ref=f16e105]
              - emphasis [ref=f16e106]: 미국 캔자스주 리븐워스 카운티의 한 잔디밭에 3일(현지시간) ‘데이터센터 반대’라고 적힌 푯말이 세워져 있다. 로이터연합뉴스
            - text: 미국 빅테크들이 주도하는 AI 인프라 확장이 주춤해질 경우 메모리 수요에 영향을 미칠 가능성도 제기된다. 데이터센터 건설이 지연 또는 보류되거나 프로젝트가 축소될 경우 최대 고객인 빅테크들의 AI 메모리 주문량 감소로도 이어질 수 있기 때문이다. 데이터센터에는 고대역폭메모리(HBM)를 비롯해 서버용 D램, 낸드플래시 기반 기업용 솔리드스테이트드라이브(SSD) 등이 필수 탑재된다.이는 고부가가치 메모리 반도체 생산으로 무게 중심을 옮기고 있는 메모리 3사의 중장기 수익성에까지 영향을 미칠 수 있다는 관측도 나온다. 다만 삼성전자와 SK하이닉스는 최근 3분기 실적 발표 당시 빅테크 등 10여개 이상 주요 고객사와의 장기공급계약(LTA) 체결로 안정적인 수익 기반을 마련했고, 향후 수년내 물량이 이미 ‘솔드아웃’된 상태라고 밝힌 바 있다.반도체 업계는 AI 데이터센터와 관련된 미국 내 정책 환경이 변화하더라도 AI 인프라 구축이나 AI발 메모리 수요가 상승하는 흐름 자체를 되돌리지는 못할 것으로 보고 있다. 데이터센터 건설을 둘러싼 각종 절차가 강화되는 등 ‘속도조절’에 들어갈 수는 있어도 AI 투자 기조는 지속될 것이란 전망이다.한 업계 관계자는 “AI 에이전트에서 피지컬AI, 로봇에까지 AI 산업이 계속 확장되면 그 근간이 되는 데이터센터와 컴퓨팅 역량 구축도 더욱 고도화될 것”이라며 “메모리 3사가 생산능력 확대를 위한 증설에 경쟁적으로 나서는 것도 이 때문”이라고 말했다. 다른 업계 관계자도 “미·중의 AI 주도권 다툼이 치열한 상황에서 미국이 AI 인프라 구축 자체를 멈출 가능성은 매우 낮다”면서 “다만 불확실성이 커지면서 주가 급락 등 일시적으로 시장 불안이 나타날 수는 있을 것”이라고 말했다.
